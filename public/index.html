<style>
/* Layout: one narrow column like a phone journal; a 13-week track is the signature element. */
:root {
  --bg: #eef3f0; --surface: #ffffff; --ink: #18221e; --muted: #5b6863; --line: #d6dfda;
  --accent: #7a3e65; --accent-ink: #ffffff; --accent-soft: #f3e7ef;
  --ok: #2e7650; --ok-soft: #e3f2e9; --warn: #9a5a0c; --warn-soft: #fbefdc; --stop: #b0322b; --stop-soft: #fbe5e3;

  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111715; --surface: #1a2220; --ink: #e6eeea; --muted: #9aa8a2; --line: #2c3733;
  --accent: #d79cc4; --accent-ink: #26131f; --accent-soft: #3a2533;
  --ok: #6cc596; --ok-soft: #1d3327; --warn: #e6a650; --warn-soft: #3a2c17; --stop: #f07b72; --stop-soft: #3d1f1d;
  --zone-quiet: #27322e; --zone-drop: #4a3622; --zone-win: #22402e; color-scheme: dark; } }
:root[data-theme="dark"] {

  --ok: #6cc596; --ok-soft: #1d3327; --warn: #e6a650; --warn-soft: #3a2c17; --stop: #f07b72; --stop-soft: #3d1f1d;

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); }
.wrap { max-width: 640px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.12; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2.4rem, 9vw, 3.4rem); font-weight: 700; letter-spacing: -0.02em; }
h2 { font-size: 1.45rem; font-weight: 700; }
h3 { font-size: 1.08rem; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font: 600 0.74rem/1.3 var(--body); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { font: 700 1.35rem/1 var(--display); letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 8px; }
.logo small { font: 500 0.82rem var(--body); color: var(--muted); letter-spacing: 0; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button { font: 600 0.88rem var(--body); color: var(--muted); background: none; border: 0; padding: 7px 10px; border-radius: 999px; cursor: pointer; }
nav button[aria-current="page"] { background: var(--ink); color: var(--bg); }
nav button:hover:not([aria-current="page"]) { color: var(--ink); }

.banner { background: var(--accent-soft); border-radius: 14px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 0.93rem; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 12px; min-width: 0; }
.stack { display: grid; gap: 18px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.btn { font: 600 0.95rem var(--body); border-radius: 999px; padding: 10px 18px; cursor: pointer; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.small { padding: 6px 12px; font-size: 0.85rem; }
.btn.danger { background: var(--stop); border-color: var(--stop); color: var(--surface); }
button:focus-visible, input:focus-visible + span, textarea:focus-visible, input[type=date]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* the 13-week course track */
.track { display: grid; grid-template-columns: repeat(13, 1fr); gap: 3px; }
.wk { height: 34px; border-radius: 6px; position: relative; display: grid; place-items: center; font: 500 0.68rem var(--mono); color: var(--muted); }
.wk.z0 { background: var(--zone-quiet); } .wk.z1 { background: var(--zone-drop); } .wk.z2 { background: var(--zone-win); }
.wk.done::after { content: ""; position: absolute; bottom: 4px; width: 5px; height: 5px; border-radius: 50%; background: var(--ink); }
.wk.now { outline: 2.5px solid var(--accent); outline-offset: 1px; color: var(--ink); font-weight: 700; }
.track-legend { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 0.78rem; color: var(--muted); }
.track-legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }

.hero { display: grid; gap: 8px; }
.hero h1 span { color: var(--muted); font-weight: 500; font-size: 0.5em; letter-spacing: 0; }

.guard { background: var(--warn-soft); border-color: transparent; }
.guard .eyebrow { color: var(--warn); }
.verdict-0 { background: var(--ok-soft); border-color: transparent; } .verdict-0 .eyebrow { color: var(--ok); }
.verdict-1 { background: var(--warn-soft); border-color: transparent; } .verdict-1 .eyebrow { color: var(--warn); }
.verdict-2 { background: var(--stop-soft); border-color: transparent; } .verdict-2 .eyebrow { color: var(--stop); }
.notes { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 2px; }
.stat b { font: 700 1.15rem var(--display); }
.up { color: var(--ok); } .flat { color: var(--muted); } .down { color: var(--stop); }

.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.shot { display: grid; gap: 6px; min-width: 0; }
.shot .img { aspect-ratio: 3 / 4; max-width: 100%; border-radius: 12px; background: var(--zone-quiet); overflow: hidden; display: grid; place-items: center; text-align: center; padding: 10px; color: var(--muted); font-size: 0.82rem; }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* forms */
form { display: grid; gap: 18px; }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; min-width: 0; }
legend { font-weight: 600; margin-bottom: 8px; padding: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label { cursor: pointer; }
.chips input { position: absolute; opacity: 0; pointer-events: none; }
.chips span { display: inline-block; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; font-size: 0.92rem; background: var(--surface); }
.chips input:checked + span { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.choices { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.choices label { cursor: pointer; }

.sw { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 6px; vertical-align: -2px; border: 1px solid var(--line); }
input[type=date], textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; max-width: 100%; }
textarea { width: 100%; min-height: 70px; resize: vertical; }
.file { display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: center; }
.file .img { aspect-ratio: 3 / 4; border-radius: 10px; background: var(--zone-quiet); overflow: hidden; display: grid; place-items: center; font-size: 0.75rem; color: var(--muted); text-align: center; }
.file img { width: 100%; height: 100%; object-fit: cover; }
.tip { font-size: 0.9rem; color: var(--muted); border-left: 3px solid var(--accent); padding-left: 10px; }
.alert { background: var(--stop-soft); color: var(--ink); border-radius: 12px; padding: 12px 14px; font-size: 0.93rem; }

/* timeline */
.phases { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.phase { display: grid; grid-template-columns: 74px 1fr; gap: 14px; padding: 16px 0; border-top: 1px solid var(--line); }
.phase:first-child { border-top: 0; }
.phase .when { font: 500 0.8rem var(--mono); color: var(--muted); padding-top: 3px; }
.phase.here { background: var(--accent-soft); border-radius: 14px; border-top-color: transparent; padding-inline: 12px; margin-inline: -12px; }
.phase.here + .phase { border-top-color: transparent; }
.here-tag { font: 600 0.72rem var(--body); text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }

.chart-box { overflow-x: auto; }
.chart-box svg { display: block; width: 100%; min-width: 420px; height: auto; }
.weeks { display: flex; gap: 6px; flex-wrap: wrap; }
.weeks span { font: 500 0.78rem var(--mono); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
.weeks span.miss { border-color: var(--warn); color: var(--warn); }

.prod { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 10px; min-width: 0; }
.prod .eyebrow { color: var(--accent); }
.rev { background: var(--bg); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; font-size: 0.9rem; }
.rev .eyebrow { color: var(--muted); }
a.btn { text-decoration: none; display: inline-block; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 0.9rem; max-width: calc(100% - 32px); }
footer { font-size: 0.8rem; color: var(--muted); display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 16px; }

@media (max-width: 460px) {
  .card { padding: 16px; }
  .file { grid-template-columns: 96px 1fr; }
  .wk { height: 28px; font-size: 0.6rem; }
  .phase { grid-template-columns: 1fr; gap: 4px; }
}
@media (prefers-reduced-motion: no-preference) {
  .card { animation: rise .35s ease both; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
}

  underarm: { label: 'Dark underarms or odour', qs: [
    { id: 'level', q: 'How dark is it?', opts: [['mild', 'Slightly darker, mostly odour'], ['marked', 'Clearly darker than my inner arm']] },
    { id: 'skin', q: 'Your skin type', opts: [['normal', 'Normal or oily'], ['dry', 'Dry'], ['sens', 'Sensitive, reacts easily']] }] },
  body: { label: 'Body acne or bumps', qs: [
    { id: 'skin', q: 'Your skin type', opts: [['dry', 'Dry'], ['normal', 'Normal or oily'], ['sens', 'Sensitive, reacts easily']] },
    { id: 'sev', q: 'What does the acne look like?', opts: [['mild', 'Small bumps, occasional spots'], ['severe', 'Painful, deep or widespread']] }] }
};
function recommend(a) {
  const r = { picks: [], tips: [], doctor: null };
  if (a.concern === 'hair') {
    if (a.type === 'thin') { r.picks = [['serum', 'Best match'], ['gummies', 'Optional add-on']]; r.tips = ['Plan for the full 3 months. Most “didn’t work” reviews stopped at around 2.', 'Have PCOS or a thyroid problem? Get that checked too. The fit check covers this.']; }
    if (a.type === 'post') { r.picks = [['postpartum', 'Best match']]; r.tips = ['Shedding after pregnancy often settles within 3 to 6 months. If it hasn’t by then, look at the growth serum.']; }
    if (a.type === 'scalp') { r.picks = [['keto', 'Start here'], ['zpto', 'If your scalp is also dry']]; r.tips = ['Calm the scalp first, then add a growth serum. Serums work better on a healthy scalp.']; }
    if (a.type === 'break') { r.picks = [['strength', 'Best match'], ['frizz', 'Alternative']]; r.tips = ['Loosen tight ponytails and braids. Breakage stops when the pull stops.']; }
    if (a.type === 'patch') r.doctor = 'Round bald patches can be alopecia areata. That needs a dermatologist, not a serum.';
  }
  if (a.concern === 'underarm' && a.level && a.skin) {
    if (a.skin === 'sens') { r.picks = [['uaNF', 'Best match for sensitive skin'], [a.level === 'mild' ? 'ua4' : 'ua6', 'Only after a patch test']]; r.tips = ['Patch-test on your inner arm for 48 hours, then start every other night.']; }
    else { r.picks = [[a.level === 'mild' ? 'ua4' : 'ua6', 'Best match'], ['uaNF', 'If you prefer no fragrance']]; }
    r.tips.push('Pause blade shaving if you can. Friction keeps re-darkening the skin.', 'It isn’t a long-lasting deodorant: one reviewer found the scent gone within 2 hours.', 'Dark, velvety skin on the neck or knuckles too? See a doctor first.');
  }
  if (a.concern === 'body' && a.skin && a.sev) {
    if (a.sev === 'severe') r.doctor = 'Painful, deep or widespread acne needs a dermatologist. A body wash is meant for mild acne.';
    else if (a.skin === 'normal') r.picks = [['bwSal', 'Best match'], ['bwCer', 'If your skin feels tight after washing']];
    else { r.picks = [['bwCer', 'Best match']]; if (a.skin === 'sens') r.tips = ['If you see redness, dryness or irritation, use it less often or stop. The brand gives the same advice.']; }
  }
  return r;
}

const VERDICT = ['Good fit. Commit to the full 12 weeks.', 'Good to start, with a check.', 'See a doctor first.'];

function verdict(c, flags) {
  const f = [...new Set(flags)].filter(k => C[c].flags[k]);
  return { lvl: Math.max(0, ...f.map(k => C[c].flags[k][0])), notes: f.map(k => C[c].flags[k][1]) };
}

function sample() {
  const start = new Date(today0() - 45 * DAY);

}

let toastTimer;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 3200); }

function shrink(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 520 / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = rej; img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

const sorted = () => [...S.entries].sort((a, b) => a.week - b.week);
const base = () => sorted()[0];
const latest = () => sorted().at(-1);
const phaseFor = (c, w) => C[c].phases.find(p => w >= p.w[0] && w <= p.w[1]) || C[c].phases[0];

function track(c, w) {
  const done = new Set(S.entries.map(e => e.week));
  const z = C[c].zones;
  const cells = z.map((zone, i) => `<div class="wk z${zone}${done.has(i + 1) ? ' done' : ''}${i + 1 === w ? ' now' : ''}" title="Week ${i + 1}">${i + 1}</div>`).join('');
  return `<div class="track" role="img" aria-label="Week ${w} of 13">${cells}</div>
  <div class="track-legend"><span style="--c:var(--zone-quiet)">Little to see yet</span><span style="--c:var(--zone-drop)">Where most people quit</span><span style="--c:var(--zone-win)">Results window</span></div>`;
}

function shotHTML(e, label) {
  const inner = e && e.photo ? `<img src="${e.photo}" alt="${esc(label)} photo">` : (S.sample ? 'Sample journey: your photo goes here' : 'No photo this week');
  return `<div class="shot"><div class="img">${inner}</div><div class="row" style="justify-content:space-between"><b>${esc(label)}</b><span class="muted mono">${e ? fmt(parse(e.date)) : ''}</span></div></div>`;
}

function trend(c) {
  const b = base(), l = latest(), P = C[c].primary;
  if (!b || !l || b === l) return { cls: 'flat', text: 'Check in to see a trend' };
  const d = l.primary - b.primary;
  return { cls: d > 0 ? 'up' : d < 0 ? 'down' : 'flat', text: d === 0 ? `Still ${P.short[l.primary]}` : `${P.short[b.primary]} → ${P.short[l.primary]}` };
}

function chart(c) {
  const P = C[c].primary, n = P.opts.length, W = 600, H = 230, L = 108, R = 14, T = 14, B = 34;
  const x = wk => L + (W - L - R) * wk / 13, y = v => T + (H - T - B) * (1 - v / (n - 1));
  const z = C[c].zones, winStart = z.indexOf(2) + 1;
  const pts = sorted();
  let g = `<rect x="${x(winStart - 1)}" y="${T}" width="${x(13) - x(winStart - 1)}" height="${H - T - B}" fill="var(--zone-win)"/>
  <text x="${x(13) - 6}" y="${T + 14}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--body)">results window</text>`;
  for (let v = 0; v < n; v++) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">${esc(P.short[v])}</text>`;
  for (let k = 0; k <= 13; k++) g += `<text x="${x(k)}" y="${H - 12}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--mono)">${k === 0 ? 'D0' : k}</text>`;
  const w = weekOf(S);
  if (w >= 1) g += `<line x1="${x(w)}" x2="${x(w)}" y1="${T}" y2="${H - B}" stroke="var(--accent)" stroke-dasharray="3 3"/>`;
  if (pts.length > 1) g += `<polyline fill="none" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round" points="${pts.map(e => `${x(e.week)},${y(e.primary)}`).join(' ')}"/>`;
  g += pts.map((e, i) => `<circle cx="${x(e.week)}" cy="${y(e.primary)}" r="${i === pts.length - 1 ? 5.5 : 3.5}" fill="${i === pts.length - 1 ? 'var(--accent)' : 'var(--ink)'}"/>`).join('');
  return `<div class="chart-box"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(P.q)} by week">${g}</svg></div>`;
}

  if (step === 1) return `${back}<div class="card"><p class="eyebrow">Step 2 of 3 · fit check</p><h2>Does this product fit your cause?</h2><p class="muted">Four questions. If something needs a doctor, it is better to know now than at week 8.</p>${fitForm(D.concern, D.answers)}</div>
  ${D.flags ? verdictCard(D.concern, D.flags) + `<div><button class="btn accent" data-act="to-baseline">${verdict(D.concern, D.flags).lvl === 2 ? 'Track anyway while I see a doctor' : 'Next: day-0 photo'}</button></div>` : ''}`;
  return `${back}<div class="card"><p class="eyebrow">Step 3 of 3 · day 0</p><h2>Your starting point</h2><p class="muted">This is the photo you’ll compare against at week 8, when the mirror says nothing has changed.</p>
  <form id="baseForm">${measureFields(D.concern, null)}<div><button class="btn accent" type="submit">Start my 90 days</button></div></form></div>`;
}

const NAV = [['today', 'Today'], ['finder', 'Find product'], ['checkin', 'Check in'], ['progress', 'Progress'], ['timeline', 'Timeline'], ['fit', 'Fit check']];
function render() {
  document.getElementById('nav').innerHTML = view === 'setup' ? '' : NAV.map(([k, l]) => `<button data-nav="${k}" ${view === k ? 'aria-current="page"' : ''}>${l}</button>`).join('');
  document.getElementById('banner').innerHTML = S.sample && view !== 'setup'
    ? `<div class="banner"><span>You’re viewing a <b>sample journey</b>: week 7 on the hair roll-on, mirror says nothing’s changed.</span><button class="btn accent small" data-act="start-own">Start my own</button></div>` : '';
  document.getElementById('reset').innerHTML = S.sample ? '' : askReset
    ? `<div class="row"><span>Delete all your check-ins and photos from this browser?</span><button class="btn danger small" data-act="reset-yes">Delete</button><button class="btn ghost small" data-act="reset-no">Keep</button></div>`
    : `<div><button class="btn ghost small" data-act="reset-ask">Start over</button></div>`;
  const V = { today: vToday, finder: vFinder, checkin: vCheckin, progress: vProgress, timeline: vTimeline, fit: vFit, setup: vSetup };
  document.getElementById('app').innerHTML = V[view]();
}

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  const n = ev.target.closest('[data-nav]');
  if (n) { view = n.dataset.nav; fitEditing = false; render(); scrollTo(0, 0); return; }
  const a = ev.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'start-own') { D = { concern: null, start: iso(today0()), answers: {}, flags: null }; step = 0; view = 'setup'; }
  if (act === 'track') { D = { concern: a.dataset.c, start: iso(today0()), answers: {}, flags: null }; step = 1; view = 'setup'; }
  if (act === 'cancel-setup') view = 'today';
  if (act === 'to-baseline') step = 2;
  if (act === 'refit') fitEditing = true;
  if (act === 'reset-ask') askReset = true;
  if (act === 'reset-no') askReset = false;
  if (act === 'reset-yes') { try { localStorage.removeItem(KEY); } catch (e) {} S = sample(); askReset = false; view = 'today'; toast('Deleted. Showing the sample journey.'); }
  render(); scrollTo(0, 0);
});

document.addEventListener('change', async ev => {
  if (ev.target.form && ev.target.form.id === 'finderForm') {
    const { name, value } = ev.target;
    F = name === 'concern' ? { concern: value } : { ...F, [name]: value };
    render(); return;
  }
  if (ev.target.id !== 'photo' || !ev.target.files[0]) return;
  try {
    photo = await shrink(ev.target.files[0]);
    document.getElementById('preview').innerHTML = `<img src="${photo}" alt="Photo preview">`;
  } catch (e) { toast('That file couldn’t be read as a photo. Try a JPG or PNG.'); }
});

function readFit(form, c) {
  const answers = {}, flags = [];
  for (const q of C[c].fit) {
    const picked = [...form.querySelectorAll(`[name="${q.id}"]:checked`)].map(i => +i.value);
    answers[q.id] = picked;
    picked.forEach(i => q.opts[i][1] && flags.push(q.opts[i][1]));
  }
  return { answers, flags };
}

document.addEventListener('submit', ev => {
  ev.preventDefault();
  const f = ev.target, fd = new FormData(f);
  if (f.id === 'concernForm') { D.concern = fd.get('concern'); D.start = fd.get('start'); step = 1; }
  if (f.id === 'fitForm') {
    if (view === 'setup') { Object.assign(D, readFit(f, D.concern)); render(); document.querySelector('.verdict-0, .verdict-1, .verdict-2')?.scrollIntoView({ behavior: 'smooth' }); return; }
    Object.assign(S, readFit(f, S.concern)); fitEditing = false; save();
  }
  if (f.id === 'baseForm') {
    S = { concern: D.concern, start: D.start, answers: D.answers, flags: D.flags || [], entries: [{ week: 0, date: D.start, primary: +fd.get('primary'), secondary: +fd.get('secondary'), missed: 0, photo, note: '' }] };
    photo = null; view = 'today';
    if (save()) toast('Day 0 saved. See you next week.');
  }
  if (f.id === 'checkForm') {
    const w = weekOf(S), entry = { week: w, date: iso(today0()), primary: +fd.get('primary'), secondary: +fd.get('secondary'), missed: +fd.get('missed'), photo, note: fd.get('note').trim() };
    S.entries = S.entries.filter(e => e.week !== w).concat(entry);
    const burn = C[S.concern].secondary.warnAt != null && entry.secondary >= C[S.concern].secondary.warnAt;
    photo = null; view = 'today';
    if (save()) toast(burn ? 'Saved. Stinging or burning: stop using it and patch-test before you continue.' : `Week ${w} saved.`);
  }
  render(); scrollTo(0, 0);
});

render();
</script>
